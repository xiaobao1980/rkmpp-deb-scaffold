# ============================================================
# mpv.conf — RK35xx 通用版（Wayland / X11 自动适配）
# 适用 SoC : RK3588 / RK3588S / RK3576 / RK3566 / RK3568
# 适用系统 : Debian 12/13 · Ubuntu 24.04/26.04 · deepin 25（不支持 Ubuntu 22.04）
#
# 本文件是「唯一来源」：
#   · 打包时由 scripts/package-debs.sh 安装为 /etc/mpv/mpv.conf
#     （dpkg conffile，升级不覆盖你的改动）
#   · 单用户使用可复制为 ~/.config/mpv/mpv.conf（优先级高于系统级）
#
# 前置条件 : 已装 rkmpp-stack（MPP + RGA + ffmpeg-rockchip）
#            与 mpv-rkmpp（打过 rkmpp hwdec 补丁的 mpv），否则 hwdec=rkmpp 不存在
# 验证方法 : 播放时另开终端 sudo fuser /dev/mpp_service，有 PID = 硬解生效
#            或看 mpv 启动日志 "Using hardware decoding (rkmpp)."
#
# 实机实测（RK3576 / Mali-G52 / mpv 0.41+补丁 / Mesa 25.2.8 / 原生 Wayland，各 10 秒）：
#   本配置                   4K H.264 30fps 掉 0 帧 ｜ 4K VP9 60fps 掉 1 帧
#   去掉 profile=fast        4K H.264 30fps 掉 97 帧｜ 4K VP9 60fps 掉 393 帧
#   --no-config（gpu-next）  4K H.264 30fps 掉 201 帧（且软解）
#   → profile=fast 是 4K 流畅的关键，不要删
# ============================================================

# ---- 视频输出 ----
# vo=gpu：mpv 0.41 默认 vo=gpu-next，它优先走 Vulkan，而 panvk 在 RK35xx 上不完整
vo=gpu
gpu-api=opengl          # Mali G610(RK3588)/G52(RK3576/356x) 走 OpenGL ES
opengl-es=auto          # EGL 下自动选 GLES（实测落到 GLES 3.1）；写 yes 在无 GLES 环境下起不来
# profile=fast 必须在其它渲染项之前：它会写入 scale/dscale/dither 等默认值，
# 后写的同项才覆盖它。缺了它在 4K 下必掉帧（见文件头的实测数据）。
profile=fast
# 想要更高画质可换 profile=gpu-hq（4K@60 大概率掉帧，1080p 无所谓）
# 不要开 vulkan：panvk 在 RK35xx 上不完整
# 不写 gpu-context：写死 wayland 会让 X11 会话（如 deepin 25）起不来，反之亦然

# ---- 硬件解码（rkmpp 零拷贝；失败按 hwdec-software-fallback 自动回软解，不中断播放）----
hwdec=rkmpp
hwdec-codecs=all        # 默认只含 h264/vc1/hevc/vp8/vp9/av1/prores 等；
                        # all 额外把 mpeg1/2/4、mjpeg、h263 也交给 mpp（rkmpp 均支持）
# 若零拷贝模式撕裂/花屏，回退 copy 模式（每帧拷回内存，用带宽换兼容）：
#hwdec=rkmpp-copy
# 想让 mpv 自己探测（不强制 rkmpp）则改：hwdec=auto-safe

# ---- Wayland 专项（X11 会话下自动忽略，无害）----
# 消黑边用 panscan（裁掉画面边缘填满窗口），默认 0 = 保持比例留黑边：
#panscan=1.0
# 拖边框改窗口大小的热区（默认 ptr=10 / touch=16），与黑边无关，一般不用改：
#wayland-edge-pixels-pointer=10
#wayland-edge-pixels-touch=16

# ---- 缓存（网络源 NFS/SMB/HTTP 更稳）----
cache=yes
cache-secs=30
demuxer-max-bytes=50M
demuxer-max-back-bytes=25M

# ---- 软解兜底调优（仅硬解失效时生效）----
vd-lavc-dr=yes
# vd-lavc-threads 不写 = auto 用满全部核心（RK3588 八核 / RK356x 四核自适应）

# ---- 10bit（NV15/NV20）片源花屏/黑屏时的备选（先取消注释试第一条）----
#vd-lavc-o=afbc=on                  # 开 AFBC 省带宽（默认 off）
#vf=scale_rkrga=force_yuv=auto      # 走 RGA 做位深/格式转换

# ---- 音频（不写 ao，自动探测 pipewire → pulse → alsa，跨发行版最稳）----
audio-buffer=0.2

# ---- 字幕 ----
slang=zh,chi,zho,eng    # 字幕轨优先中文
alang=zh,eng            # 音轨优先中文
sub-font-size=40
sub-auto=fuzzy
# sub-ass-override 保持默认 yes：应用上面的字号，但保留 ASS 的定位与特效。
# 只有想彻底压制片源自带 ASS 样式时才改成 force（会丢掉特效与排版）。

# ---- 播放行为 ----
save-position-on-quit=yes
reset-on-next-file=pause
# 展厅/数字标牌场景再开（音频文件也会弹空窗口，桌面日常别开）：
#force-window=immediate
#fullscreen=yes

# ---- 排障时取消注释（看硬解/输出链路日志）----
#msg-level=vd=debug:vo=debug:hwdec=debug

# ============================================================
# 审计记录 —— 以下写法都有问题，勿加回：
#   gpu-context=wayland        → 写死会话类型，X11 下必挂
#   drm-connector=:0           → 语法张冠李戴（":0" 是 X display），必报错
#   gpu-hwdec-interop=rkmpp    → 非法值；零拷贝 interop 名为 drmprime
#   libplacebo-opts=compute_shader=no → 非法键名，无效
#   ao=pipewire                → 写死后无 pipewire 的系统无声
#   vd-lavc-threads=4          → 砍掉 RK3588 一半软解能力，用 auto
#   wayland-edge-pixels=N      → 选项名不存在，启动即报 option not found（实测不生效）；
#                                且它的用途是拖边热区，跟「消黑边」无关
# ============================================================
